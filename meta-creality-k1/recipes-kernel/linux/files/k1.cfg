# Creality K1 on top of nebulaos_halley5_v30_defconfig

# Board device tree: K1 instead of the KE/halley5 one
# CONFIG_DT_HALLEY5_V30 is not set
CONFIG_DT_X2000_MODULE_BASE=y
CONFIG_DT_X2000_MODULE_BASE_DTS_FILE="x2000/creality_k1.dts"

# Root filesystem is squashfs-xz in the slot partition
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_XZ=y

# Goodix GT9xx touch on i2c4
CONFIG_INPUT_TOUCHSCREEN=y
CONFIG_TOUCHSCREEN_GOODIX=y

# CYW43438 Wi-Fi (brcmfmac) and Bluetooth over UART (H5).
# NebulaOS builds the firmware into the kernel from the build host's
# /lib/firmware; here brcmfmac is a module and loads it from the rootfs
# (linux-firmware-bcm43430 + a K1 NVRAM file, still to be extracted from stock).
# CONFIG_EXTRA_FIRMWARE is set by the recipe: cfg80211 is built in and asks
# for regulatory.db before the root filesystem is there, so only that
# database (and its signature) is built into the kernel.
CONFIG_BRCMFMAC=m
CONFIG_BRCMFMAC_SDIO=y
CONFIG_BT=y
CONFIG_BT_HCIUART=y
CONFIG_BT_HCIUART_3WIRE=y
CONFIG_BT_HCIUART_BCM=y

# USB camera (CREALITY CAM, Sonix 0c45:6366)
CONFIG_MEDIA_SUPPORT=y
CONFIG_MEDIA_USB_SUPPORT=y
CONFIG_USB_VIDEO_CLASS=y

# systemd needs these
CONFIG_CGROUPS=y
CONFIG_AUTOFS_FS=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_FHANDLE=y

# OpenOCD flashes the MCUs over GPIO SWD
CONFIG_GPIO_CDEV=y

# Klipper's Linux host MCU talks to the EEPROM through /dev/i2c-2
CONFIG_I2C_CHARDEV=y

# Helix video codec (H.264/JPEG encoder, JPEG decoder) for the timelapse.
# The driver is the vendor one in module_drivers/; NebulaOS compiles it out.
# Rate control: neither the netlink variant (needs a userspace server nobody
# has) nor the in-kernel one (links the prebuilt librc.a_shipped); the
# "none" choice added by 0001-helix-rc-none.patch encodes at a fixed QP.
# Felix (H.264 decoder) stays off.
CONFIG_VIDEO_INGENIC_VCODEC=y
CONFIG_INGENIC_HELIX=y
CONFIG_INGENIC_HELIX_H264E_RC_NONE=y
# CONFIG_INGENIC_HELIX_H264E_RC_NETLINK is not set
# CONFIG_INGENIC_HELIX_H264E_RC_IN_KERNEL is not set
# CONFIG_INGENIC_FELIX is not set
