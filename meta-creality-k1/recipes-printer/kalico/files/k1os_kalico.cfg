# K1 OS: Kalico on the Creality K1. Included from printer.cfg by the
# kalico-config converter. Hardware facts come from the stock [prtouch_v2]
# section: the bed leveling MCU reads four HX711 strain gauges.

[mcu leveling_mcu]
serial: /dev/ttyS9
baud: 230400
restart_method: command

[load_cell_probe]
sensor_type: hx711s
dout_pins: leveling_mcu:PA1, leveling_mcu:PA0, leveling_mcu:PA3, leveling_mcu:PA4
sclk_pins: leveling_mcu:PA5, leveling_mcu:PA2, leveling_mcu:PA6, leveling_mcu:PA7
sensor_orientation: inverted
sample_rate: 80
gain: A-128
# grams; the K1 bed gauges trigger reliably at this force
trigger_force: 160
force_safety_limit: 2000
drift_safety_limit: 1000
# 3 mm/s: same repeatability as 1 mm/s (0.006 mm over 8 samples), mesh 40 % faster;
# stepper_z homing_speed is kept equal so G28 Z and the mesh share one reference
speed: 3.0
lift_speed: 10.0
pullback_speed: 1.0
pullback_distance: 0.5
sample_retract_dist: 0.5
drop_first_result: False
samples: 1
samples_result: median
samples_tolerance: 0.05
samples_tolerance_retries: 3
tap_classifier: tap_quality
# The nozzle triggers the load cells only after it is pressed into the
# sheet, and the hotend grows between the 140 C it probes at and the
# print temperature: measured on a full-bed sheet print, the first layer
# needed +0.21 mm (SET_GCODE_OFFSET). Negative raises the nozzle.
z_offset: -0.21

[bed_mesh]
speed: 150
mesh_min: 5,5
mesh_max: 215,215
zero_reference_position: 110,110
probe_count: 5,5
mesh_pps: 3,3
algorithm: bicubic
adaptive_margin: 3
horizontal_move_z: 8
fade_start: 5.0
fade_end: 50.0

[danger_options]
allow_plugin_override: True
single_mcu_trsync_timeout: 0.25
multi_mcu_trsync_timeout: 0.050
log_statistics: False
log_config_file_at_startup: False

# Values the stock macros read from Creality's [custom_macro] section, plus
# the print temperatures START_PRINT asked for (set by CX_ROUGH_G28) and the
# silicone wipe pad behind the bed (stock prtouch_v2 clr_noz_* values).
[gcode_macro _K1OS_PARAMS]
variable_default_bed_temp: 50
variable_default_extruder_temp: 240
variable_g28_ext_temp: 140
variable_print_ext_temp: 0
variable_print_bed_temp: 0
variable_wipe_x_min: 95
variable_wipe_x_len: 40
variable_wipe_y: 222
variable_wipe_press: 0.15
variable_wipe_x: 95
gcode:

# Shims for commands that only Creality's Klipper fork provides.
#
# The start sequence stock START_PRINT drives, as done here:
#   CX_ROUGH_G28          bed heater on, nozzle to 140, home everything
#   CX_NOZZLE_CLEAR       find the pad, heat to the print temperature, wipe,
#                         cool back to 140 with the part fan, wait for the bed
#   ACCURATE_G28          G28 Z with the clean 140 degree nozzle (no ooze)
#   _KALICO_BED_MESH      probe the mesh at the same temperature
#   CX_PRINT_DRAW_ONE_LINE  heat to the print temperature, purge line
[gcode_macro PRTOUCH_READY]
gcode:

# Creality's slicer profiles emit T0; there is one tool.
[gcode_macro T0]
gcode:

# Creality's END_PRINT emits this; Klipper spells it EXCLUDE_OBJECT RESET=1.
[gcode_macro EXCLUDE_OBJECT_RESET]
gcode:
  EXCLUDE_OBJECT RESET=1

[gcode_macro ACCURATE_HOME_Z]
gcode:
  G28 Z

[gcode_macro CX_ROUGH_G28]
description: Start the heaters and home (stock START_PRINT calls this first)
gcode:
  {% set p = printer['gcode_macro _K1OS_PARAMS'] %}
  {% set ext = params.EXTRUDER_TEMP|default(p.default_extruder_temp)|float %}
  {% set bed = params.BED_TEMP|default(p.default_bed_temp)|float %}
  SET_GCODE_VARIABLE MACRO=_K1OS_PARAMS VARIABLE=print_ext_temp VALUE={ext}
  SET_GCODE_VARIABLE MACRO=_K1OS_PARAMS VARIABLE=print_bed_temp VALUE={bed}
  M140 S{bed}
  M104 S{p.g28_ext_temp}
  G28

[gcode_macro CX_NOZZLE_CLEAR]
description: Wipe the nozzle on the pad at the print temperature, then cool it for probing
gcode:
  {% set p = printer['gcode_macro _K1OS_PARAMS'] %}
  {% if 'xyz' not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  # a different spot of the pad each time, so it wears evenly
  {% set x = p.wipe_x_min + (printer.toolhead.estimated_print_time|int % (p.wipe_x_len - 20)) %}
  SET_GCODE_VARIABLE MACRO=_K1OS_PARAMS VARIABLE=wipe_x VALUE={x}
  G90
  G1 Z5 F600
  G1 X{x} Y{p.wipe_y} F6000
  M104 S{p.g28_ext_temp}
  PROBE SAMPLES=1
  _WIPE_NOZZLE_ON_PAD

[gcode_macro NOZZLE_CLEAR]
gcode:
  CX_NOZZLE_CLEAR

[gcode_macro _WIPE_NOZZLE_ON_PAD]
description: Second half of CX_NOZZLE_CLEAR, runs once PROBE has found the pad
gcode:
  {% set p = printer['gcode_macro _K1OS_PARAMS'] %}
  {% set pad = printer.probe.last_z_result %}
  {% set x = p.wipe_x %}
  {% set ext = p.print_ext_temp or p.default_extruder_temp %}
  {% set bed = p.print_bed_temp or p.default_bed_temp %}
  G1 Z{pad + 2} F600
  M109 S{ext}
  G1 Z{pad - p.wipe_press} F300
  G1 X{x + 20} F600
  G1 X{x} F600
  G1 X{x + 20} F600
  G1 X{x} F600
  G1 X{x + 20} F600
  M106 S255
  M109 S{p.g28_ext_temp}
  G1 Z{pad + 5} F600
  M106 S0
  M190 S{bed}

[gcode_macro CX_PRINT_LEVELING_CALIBRATION]
description: Probe a fresh bed mesh with the load cell probe (adaptive when the print's objects are known)
gcode:
  {% if printer.exclude_object is defined and printer.exclude_object.objects|length > 0 %}
    BED_MESH_CALIBRATE ADAPTIVE=1
  {% else %}
    BED_MESH_CALIBRATE PROFILE=default
  {% endif %}

# Klipper reads a command name as letters followed by digits, so a macro
# called _K1OS_BED_MESH would run as "_K1": no digits in macro names.
[gcode_macro _KALICO_BED_MESH]
gcode:
  CX_PRINT_LEVELING_CALIBRATION

[gcode_macro CX_PRINT_DRAW_ONE_LINE]
description: Wait for the print temperatures, then purge along the front edge (stock does both here)
gcode:
  {% set p = printer['gcode_macro _K1OS_PARAMS'] %}
  {% set ext = p.print_ext_temp or printer.extruder.target %}
  {% set bed = p.print_bed_temp or printer.heater_bed.target %}
  {% if bed > 0 %}
    M190 S{bed}
  {% endif %}
  {% if ext > 0 %}
    M109 S{ext}
  {% endif %}
  SAVE_GCODE_STATE NAME=_k1os_purge
  G90
  G1 X5 Y5 Z5 F6000
  G1 Z0.3 F600
  G92 E0
  G1 X100 E15 F1500
  G1 X105 E16 F1500
  G92 E0
  G1 Z2 F600
  RESTORE_GCODE_STATE NAME=_k1os_purge
