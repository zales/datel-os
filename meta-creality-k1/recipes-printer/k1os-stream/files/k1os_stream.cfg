# Datel OS: Twitch live stream controls for Mainsail (and OrcaSlicer's device
# tab). The work happens in Moonraker's k1os_stream component; these macros
# only call it, so the stream key never passes through G-code.
# Included from k1os_kalico.cfg as [include /usr/share/k1os/stream.cfg].
#
#   TWITCH          dialog with Start, Stop, quality, overlay and ingest buttons
#   TWITCH_START    start k1os-twitch.service (key from /usr/data/k1os/twitch.env)
#   TWITCH_STOP     stop it
#   TWITCH_SET      RESOLUTION=1280x720|640x480 BITRATE=<kbit/s>
#                   OVERLAY=0|1|2 (plain camera, status bar, bar and graph panel)
#                   INGEST=auto|eu|us|rtmp://host/app  (any subset)
#   TWITCH_LOGIN    Twitch authorization for the automatic stream title
#   TWITCH_STATUS   state, settings and the current title in the console

[gcode_macro TWITCH]
description: Twitch stream: open the control dialog
gcode:
    {action_call_remote_method("k1os_stream_dialog")}

[gcode_macro TWITCH_START]
description: Start the Twitch live stream of the camera
gcode:
    {action_call_remote_method("k1os_stream_start")}

[gcode_macro TWITCH_STOP]
description: Stop the Twitch live stream
gcode:
    {action_call_remote_method("k1os_stream_stop")}

[gcode_macro TWITCH_SET]
description: Twitch stream settings: RESOLUTION BITRATE OVERLAY=0|1|2 INGEST
gcode:
    {action_call_remote_method("k1os_stream_set",
                               resolution=params.RESOLUTION|default(None),
                               bitrate_kbps=params.BITRATE|default(None),
                               overlay=params.OVERLAY|default(None),
                               ingest=params.INGEST|default(None))}

[gcode_macro TWITCH_LOGIN]
description: Log the printer in to Twitch (device code) for the automatic stream title
gcode:
    {action_call_remote_method("k1os_stream_login")}

[gcode_macro TWITCH_STATUS]
description: Twitch stream state, settings and title in the console
gcode:
    {action_call_remote_method("k1os_stream_status")}
