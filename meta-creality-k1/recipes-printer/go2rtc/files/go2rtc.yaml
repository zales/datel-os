# go2rtc on Datel OS: the camera as H.264 from the Helix codec (k1os-stream,
# started on demand through /usr/libexec/k1os/h264-source) for Mainsail's
# WebRTC player and for the Twitch stream (k1os-twitch reads it as MP4).
# One encoder serves every viewer; it runs while anyone watches.
#
# The API stays on localhost: nginx passes only /go2rtc/api/ws?src=k1 on, so
# nobody on the network can add streams (an exec: source runs a command).
log:
  format: text
  level: info

api:
  listen: "127.0.0.1:1984"
  base_path: "/go2rtc"

rtsp:
  listen: ""

webrtc:
  listen: ":8555"

streams:
  k1: "exec:/usr/libexec/k1os/h264-source#killsignal=15#killtimeout=5"
