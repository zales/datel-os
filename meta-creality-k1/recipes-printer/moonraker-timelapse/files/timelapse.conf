# Datel OS: timelapse (moonraker-timelapse) rendered on the Helix hardware codec.
# Added to moonraker.conf once by k1os-datadir-setup; the settings themselves
# (mode, frame rate, CRF, park position) live in Mainsail's Timelapse panel.
[timelapse]
output_path: /usr/data/k1os/timelapse/
frame_path: /usr/data/k1os/timelapse/frames/
ffmpeg_binary_path: /usr/libexec/k1os/timelapse-render
snapshoturl: http://127.0.0.1/webcam/?action=snapshot
