require conf/distro/poky.conf

DISTRO = "k1os"
DISTRO_NAME = "K1 OS (open-source firmware for the Creality K1)"
DISTRO_VERSION = "0.1.0"
DISTRO_CODENAME = "first-light"

# systemd supervises Klipper and Moonraker; read-only root with volatile /var.
INIT_MANAGER = "systemd"
DISTRO_FEATURES:append = " wifi bluetooth usbhost read-only-rootfs"
DISTRO_FEATURES:remove = "x11 wayland vulkan opengl 3g nfc zeroconf pcmcia nfs"

# 214 MiB usable RAM: keep the journal in memory and small.
VOLATILE_LOG_DIR = "yes"

# Stock printers keep user data on /usr/data (mmcblk0p10, ext4), shared with the
# stock slot. K1 OS writes only below /usr/data/k1os. It never touches mmcblk0p9,
# the stock overlay partition.
K1OS_DATA_DIR = "/usr/data/k1os"
