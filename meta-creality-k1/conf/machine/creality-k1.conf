#@TYPE: Machine
#@NAME: Creality K1 (CR4CU220812S11/S12, Ingenic X2000)
#@DESCRIPTION: Creality K1 3D printer mainboard. Dual XBurst2 MIPS32r2 + MSA, 256 MiB RAM, 8 GB eMMC.

require conf/machine/include/tune-mips32r2el-fp64.inc
DEFAULTTUNE = "mips32r2el-fp64"

PREFERRED_PROVIDER_virtual/kernel = "linux-x2000"
PREFERRED_VERSION_linux-x2000 = "6.6%"

# The stock Ingenic bootloader stays in place. It loads an Ingenic "xImage"
# from the active kernel slot (mmcblk0p5 or p6) and passes, among others:
#   console=ttyS2,115200n8 lcm_id=<panel> init=/linuxrc root=/dev/mmcblk0p7|8 rootfstype=squashfs ro
KERNEL_IMAGETYPE = "xImage"
KERNEL_IMAGETYPES = "xImage"

SERIAL_CONSOLES = "115200;ttyS2"

# Root filesystem goes into a 300 MiB slot partition as a read-only squashfs.
IMAGE_CLASSES += "image_types_creality"
IMAGE_FSTYPES = "squashfs-xz creality-ota"
# The root is a squashfs: what must fit rootfs2 (300 MiB) is the compressed
# image, which tools/flash-slot2.sh checks. This is only a sanity cap on the
# uncompressed tree (bitbake adds IMAGE_OVERHEAD_FACTOR 1.3 to it).
IMAGE_ROOTFS_MAXSIZE = "409600"

MACHINE_FEATURES = "wifi bluetooth screen touchscreen usbhost alsa"

# CYW43438 (SDIO 02d0:a9a6) on msc1
MACHINE_EXTRA_RRECOMMENDS += "linux-firmware-bcm43430 kernel-modules"

# Board identity used by the OTA package (must match /etc/ota_info of stock firmware).
CREALITY_BOARD = "CR4CU220812S11"
