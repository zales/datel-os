# Multi-gen LRU thrashing prevention: when the pages used in the last second
# cannot be kept in memory, the kernel calls the OOM killer instead of
# evicting and re-reading them over and over. That turns "the printer froze"
# into "the camera relay was killed" (see OOMScoreAdjust in the units).
w /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 1000
