# Memory on a printer with 216 MB of RAM and swap in zram (k1os-zram-swap).
# Swapping to zram is cheap, reading program code back from squashfs-xz is
# not: prefer to swap, one page at a time (there is no disk to read ahead on).
vm.swappiness = 100
vm.page-cluster = 0
# Start reclaiming a little earlier than the default 1.8 MB of free memory.
vm.min_free_kbytes = 4096
